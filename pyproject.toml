[project]
name = "santinela"
version = "0.3.0"
description = "SANTINELA TCDE - nucleu determinist de urmarire a dronelor din rapoarte umane si senzori (plan v2)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
santinela-demo = "santinela.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["santinela*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
